<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>开发者工具箱</title>
<link rel="icon" href="icons/icon48.png" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div class="app">

  <!-- 左侧：功能切换 TAB -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">{ }</span>
      <span class="brand-text">
        <strong>开发者工具箱</strong>
        <small>DevToolkit</small>
      </span>
    </div>

    <nav class="nav" id="nav">
      <p class="nav-label">工具</p>
      <button class="nav-item is-active" type="button" data-tool="json">
        <span class="nav-icon">{ }</span>
        <span class="nav-text">
          <strong>JSON 处理</strong>
          <small>格式化 / 转义</small>
        </span>
      </button>
      <button class="nav-item" type="button" data-tool="codec">
        <span class="nav-icon">A</span>
        <span class="nav-text">
          <strong>编码转换</strong>
          <small>Base64 / URL / Unicode</small>
        </span>
      </button>
      <button class="nav-item" type="button" data-tool="timestamp">
        <span class="nav-icon">#</span>
        <span class="nav-text">
          <strong>时间戳转换</strong>
          <small>秒 / 毫秒 / 日期</small>
        </span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <span class="dot"></span>
      v1.3.0 · 数据只留在这台机器上
    </div>
  </aside>

  <!-- 右侧：当前功能的操作区 -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-main">
        <button class="icon-btn" type="button" id="sidebar-toggle"
          aria-controls="sidebar" aria-expanded="true" aria-label="收起侧栏" title="收起侧栏">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M9.5 3.5 5 8l4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <div class="topbar-text">
          <h1 id="tool-title">JSON 处理工具</h1>
          <p id="tool-desc">一次粘贴，三种处理：格式化、压缩转义、去除转义</p>
        </div>
      </div>
      <span class="badge">本地处理 · 无网络请求</span>
    </header>

    <!-- ========== JSON 处理 ========== -->
    <section class="panel" data-panel="json">
      <div class="toolbar">
        <button class="btn btn-primary" type="button" data-json-action="format">格式化</button>
        <button class="btn" type="button" data-json-action="minify">压缩转义</button>
        <button class="btn" type="button" data-json-action="unescape">去除转义</button>
        <span class="toolbar-hint" data-json="hint">格式化：把 JSON 整理成 2 空格缩进的多行结构</span>
        <label class="switch" title="长行折行显示，不用左右拖动">
          <input class="switch-input" type="checkbox" data-json="wrap" checked />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-text">自动换行</span>
        </label>
      </div>

      <div class="workspace">
        <section class="pane" data-json="pane-input">
          <div class="pane-head">
            <span class="pane-title">输入</span>
            <div class="pane-actions">
              <button class="link-btn" type="button" data-json="clear">清空</button>
            </div>
          </div>
          <div class="editor">
            <div class="gutter"><div class="gutter-inner"></div></div>
            <div class="code-area">
              <pre class="highlight" aria-hidden="true"><code></code></pre>
              <textarea wrap="off" spellcheck="false" autocomplete="off"
                placeholder="粘贴 JSON 或转义字符串…"></textarea>
            </div>
          </div>
          <div class="pane-foot">
            <span class="stat" data-json="input-stat">0 字符 · 0 行</span>
            <span class="status" data-json="input-status"></span>
          </div>
        </section>

        <div class="splitter" role="separator" aria-orientation="vertical" tabindex="0"
          aria-label="调整输入与输出的宽度" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></div>

        <section class="pane" data-json="pane-output">
          <div class="pane-head">
            <span class="pane-title">输出</span>
            <div class="pane-actions">
              <button class="link-btn" type="button" data-json="use-as-input">用作输入</button>
              <button class="link-btn" type="button" data-json="copy">复制</button>
            </div>
          </div>
          <div class="editor">
            <div class="gutter"><div class="gutter-inner"></div></div>
            <div class="code-area">
              <pre class="highlight" aria-hidden="true"><code></code></pre>
              <textarea wrap="off" spellcheck="false" readonly
                placeholder="处理结果会出现在这里"></textarea>
            </div>
          </div>
          <div class="pane-foot">
            <span class="stat" data-json="output-stat">等待处理</span>
            <span class="status" data-json="output-status"></span>
          </div>
        </section>
      </div>
    </section>

    <!-- ========== 编码转换 ========== -->
    <section class="panel" data-panel="codec" hidden>
      <div class="toolbar">
        <div class="segmented" data-codec="types">
          <button class="seg-item is-active" type="button" data-type="base64">Base64</button>
          <button class="seg-item" type="button" data-type="url">URL</button>
          <button class="seg-item" type="button" data-type="unicode">Unicode</button>
        </div>
        <div class="segmented" data-codec="directions">
          <button class="seg-item is-active" type="button" data-direction="encode">编码</button>
          <button class="seg-item" type="button" data-direction="decode">解码</button>
        </div>
        <span class="toolbar-hint" data-codec="hint">Base64 编码：按 UTF-8 把文本转成 Base64</span>
      </div>

      <div class="workspace">
        <section class="pane" data-codec="pane-input">
          <div class="pane-head">
            <span class="pane-title">输入</span>
            <div class="pane-actions">
              <button class="link-btn" type="button" data-codec="clear">清空</button>
            </div>
          </div>
          <textarea class="plain-editor" data-codec="input" spellcheck="false"
            placeholder="粘贴要编码或解码的文本"></textarea>
          <div class="pane-foot">
            <span class="stat" data-codec="input-stat">0 字符</span>
            <span class="status" data-codec="status"></span>
          </div>
        </section>

        <div class="splitter" role="separator" aria-orientation="vertical" tabindex="0"
          aria-label="调整输入与输出的宽度" aria-valuemin="20" aria-valuemax="80" aria-valuenow="50"></div>

        <section class="pane" data-codec="pane-output">
          <div class="pane-head">
            <span class="pane-title">输出</span>
            <div class="pane-actions">
              <button class="link-btn" type="button" data-codec="use-as-input">用作输入</button>
              <button class="link-btn" type="button" data-codec="copy">复制</button>
            </div>
          </div>
          <textarea class="plain-editor" data-codec="output" spellcheck="false" readonly
            placeholder="处理结果会出现在这里"></textarea>
          <div class="pane-foot">
            <span class="stat" data-codec="output-stat">等待处理</span>
            <span class="status" data-codec="output-status"></span>
          </div>
        </section>
      </div>
    </section>

    <!-- ========== 时间戳转换 ========== -->
    <section class="panel" data-panel="timestamp" hidden>
      <div class="ts-now">
        <div class="ts-now-card">
          <span class="ts-now-label">当前毫秒时间戳</span>
          <strong class="ts-now-value" data-ts="now-ms">—</strong>
          <button class="link-btn" type="button" data-ts="copy-now" data-src="now-ms">复制</button>
        </div>
        <div class="ts-now-card">
          <span class="ts-now-label">当前秒级时间戳</span>
          <strong class="ts-now-value" data-ts="now-s">—</strong>
          <button class="link-btn" type="button" data-ts="copy-now" data-src="now-s">复制</button>
        </div>
        <div class="ts-now-card">
          <span class="ts-now-label">当前本地时间</span>
          <strong class="ts-now-value" data-ts="now-local">—</strong>
          <button class="link-btn" type="button" data-ts="copy-now" data-src="now-local">复制</button>
        </div>
      </div>

      <div class="ts-form">
        <input class="text-input" data-ts="input" type="text" spellcheck="false" autocomplete="off"
          placeholder="粘贴时间戳或日期，如 1761658200000 / 2026-10-28 20:30:00" />
        <button class="btn" type="button" data-ts="fill-now">填入当前时间</button>
        <button class="btn btn-primary" type="button" data-ts="convert">转换</button>
      </div>

      <div class="ts-result" data-ts="result">
        <div class="ts-empty">输入时间戳或日期，结果会在这里展开</div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/json-tool.js"></script>
<script src="js/codec-tool.js"></script>
<script src="js/timestamp-tool.js"></script>
<script src="js/ui.js"></script>
<script src="js/tools/json-panel.js"></script>
<script src="js/tools/codec-panel.js"></script>
<script src="js/tools/timestamp-panel.js"></script>
<script src="js/main.js"></script>
</body>
</html>
